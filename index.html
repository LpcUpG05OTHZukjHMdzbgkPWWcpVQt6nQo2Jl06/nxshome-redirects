<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Weiterleitung läuft...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            padding: 2rem;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🚀 Weiterleitung...</h2>
        <p id="status">Ziel wird ermittelt...</p>
    </div>

    <script>
        async function handleRedirect() {
            const hostname = window.location.hostname;
            const pathname = window.location.pathname;
            
            let key = "";
            const parts = hostname.split('.');

            // Fall 1: Subdomain-Modus (z.B. amzn.nxshome.de, aber nicht www oder short)
            if (parts.length > 2 && parts[0] !== 'www' && parts[0] !== 'short') {
                key = parts[0];
            } 
            // Fall 2: Pfad-Modus unter short.nxshome.de/[dienst]
            else if (parts.length >= 3 && parts[0] === 'short' && pathname.length > 1) {
                key = pathname.substring(1).split('/')[0];
            }
            // Fall 3: Pfad-Modus unter nxshome.de/short/[dienst]
            else if (parts.length === 2 && pathname.startsWith('/short/')) {
                const pathParts = pathname.split('/');
                if (pathParts.length > 2 && pathParts[2] !== "") {
                    key = pathParts[2];
                }
            }

            // Wenn kein Key angegeben wurde -> sofort zur Startseite
            if (!key) {
                window.location.replace('https://nxshome.de');
                return;
            }

            // Zeitstempel für Cache-Busting erzeugen (verhindert das Cischen von urls.txt / gone.txt)
            const cacheBuster = Date.now();
            const activeUrl = `https://raw.githubusercontent.com/LpcUpG05OTHZukjHMdzbgkPWWcpVQt6nQo2Jl06/nxshome-redirects/refs/heads/main/urls.txt?t=${cacheBuster}`;
            const goneUrl = `https://raw.githubusercontent.com/LpcUpG05OTHZukjHMdzbgkPWWcpVQt6nQo2Jl06/nxshome-redirects/refs/heads/main/gone.txt?t=${cacheBuster}`;

            try {
                // 1. Aktive Weiterleitungen prüfen
                const responseActive = await fetch(activeUrl, { cache: 'no-store' });
                const textActive = await responseActive.text();
                
                let targetUrl = "";
                const linesActive = textActive.split('\n');
                
                for (let line of linesActive) {
                    const lineParts = line.trim().split(/\s+/);
                    if (lineParts.length >= 2 && lineParts[0] === key) {
                        targetUrl = lineParts[1];
                        break;
                    }
                }

                if (targetUrl) {
                    document.getElementById('status').innerText = `Leite weiter zu ${targetUrl}...`;
                    window.location.replace(targetUrl);
                    return;
                }

                // 2. Prüfen, ob der Link deaktiviert wurde (gone.txt)
                const responseGone = await fetch(goneUrl, { cache: 'no-store' });
                const textGone = await responseGone.text();
                const linesGone = textGone.split('\n');
                
                let isGone = false;
                for (let line of linesGone) {
                    const cleanLine = line.trim();
                    if (cleanLine === key) {
                        isGone = true;
                        break;
                    }
                }

                if (isGone) {
                    // Deaktivierter Link: 5 Sekunden anzeigen und dann weiterleiten
                    document.getElementById('status').innerText = `Diese Weiterleitung ist nicht mehr aktiv.`;
                    setTimeout(() => {
                        window.location.replace('https://nxshome.de');
                    }, 5000);
                } else {
                    // Nicht existierender Link / Tippfehler: Sofort weiterleiten
                    window.location.replace('https://nxshome.de');
                }

            } catch (error) {
                // Bei technischem Fehler direkt zur Startseite
                window.location.replace('https://nxshome.de');
            }
        }

        handleRedirect();
    </script>
</body>
</html>
